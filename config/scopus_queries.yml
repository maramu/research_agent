biological_gas_odor_treatment:
- TITLE-ABS-KEY(biofiltration OR "biotrickling filter" OR BTF) AND TITLE-ABS-KEY("odor
  removal" OR "VOC removal" OR "volatile organic compound")
anoxic_biogas_biodesulfurization:
- TITLE-ABS-KEY("anoxic desulfurization" OR "anoxic biodesulfurization") AND TITLE-ABS-KEY(biogas)
- TITLE-ABS-KEY ( "anoxic desulfurization" OR "anoxic biodesulfurization" OR "anoxic
  biogas" OR "anoxic H2S" OR "anoxic hydrogen sulfide" OR "anoxic biotrickling filter"
  )
bioplastics_microplastics:
- TITLE-ABS-KEY ( microplastics biodegradation AND ( "anaerobic digestion" OR "wastewater"
  OR "bioagumentation" ) )
biogas_upgrading_biomethanation:
- TITLE-ABS-KEY("biogas upgrading" OR biomethanation) AND TITLE-ABS-KEY(("hydrogen"
  OR "H2") AND ("CO2" OR "carbon dioxide"))
- TITLE-ABS-KEY ( biogas bioelectrochemical upgrading )
- TITLE-ABS-KEY ( biogas hollow fiber upgrading )
microalgae:
- TITLE-ABS-KEY(microalgae AND ("wastewater treatment" OR "nutrient removal" OR "CO2
  fixation"))
single_cell_protein:
- TITLE-ABS-KEY("single cell protein" OR "microbial protein") AND TITLE-ABS-KEY("methane"
  OR "biogas" OR "methanotrophic")
advanced_oxidation_processes:
- TITLE-ABS-KEY(("photocatalysis" OR "heterogeneous photocatalysis") AND ("TiO2" OR
  "titanium dioxide" OR "ZnO"))
bioleaching_critical_materials:
- TITLE-ABS-KEY(bioleaching AND ("platinum group metals" OR "PGM" OR "palladium" OR
  "platinum" OR "rhodium"))
thiosulfate:
- TITLE-ABS-KEY ( ( thiosulfate OR thiosulphate ) AND ( polysulfide* OR polysulphide* OR "sulfur selectivity" ) AND ( biodesulfuri* OR biodesulphuri* OR "sulfide oxidation" ) AND ( haloalkal* OR alkaline OR "high pH" ) )
- TITLE-ABS-KEY ( ( sulfide OR sulphide OR polysulfide* OR polysulphide* ) W/3 ( oxidation OR autoxidation ) AND ( abiotic OR chemical OR kinetic* ) AND ( thiosulfate OR thiosulphate ) )
- TITLE-ABS-KEY ( ( sulfite OR sulphite ) AND ( "elemental sulfur" OR "elemental sulphur" OR "zero-valent sulfur" ) AND ( thiosulfate OR thiosulphate ) AND ( formation OR reaction OR kinetic* ) )
- TITLE-ABS-KEY ( ( biogenic OR biological OR microbial OR bacterial ) W/3 ( thiosulfate OR thiosulphate ) AND ( production OR accumulation OR lixiviant OR leaching ) )
- TITLE-ABS-KEY ( ( thiosulfate OR thiosulphate ) W/3 leach* AND ( sulfate OR sulphate OR polythionate* OR "thiosulfate consumption" OR "thiosulfate degradation" ) AND ( gold OR palladium OR "precious metal*" OR "platinum group metal*" ) )
- TITLE-ABS-KEY ( ( thiosulfate OR thiosulphate ) AND ( "ion chromatography" OR iodometr* ) AND ( sulfate OR sulfite OR polythionate* OR "sulfur species" OR speciation ) )
- TITLE-ABS-KEY ( ( "sulfide:quinone oxidoreductase" OR sqr OR "flavocytochrome c" OR fccB OR "sox system" OR soxB ) AND ( haloalkaliphil* OR biodesulfuri* OR "sulfur-oxidizing bacteria" ) )
- TITLE-ABS-KEY ( thioalkalimicrobium OR "thiomicrospira aerophila" OR thioalkalivibrio OR desulfurispirillum )
- TITLE-ABS-KEY ( ( "microbial community" OR "bacterial community" OR 16S ) AND ( biodesulfuri* OR "biological desulfurization" OR "sulfide-oxidizing bioreactor" ) AND ( haloalkal* OR alkaline OR halomonas ) )
- TITLE-ABS-KEY ( bioaugmentation AND ( sulfide OR sulphide OR "sulfur-oxidizing" OR desulfuri* OR "H2S removal" ) )
- TITLE-ABS-KEY ( biodesulfuri* AND ( "dual-reactor" OR "sulfidic bioreactor" OR "two-stage" ) AND ( selectivity OR alkalinity OR "caustic consumption" OR "bleed stream" ) )