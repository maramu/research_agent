# scopus_queries.yml — Queries de búsqueda en Scopus por categoría
#
# Formato de query: sintaxis Scopus Search API
#   TITLE-ABS-KEY(...)   → busca en título, abstract y palabras clave
#   AND / OR / AND NOT   → operadores lógicos
#   W/N                  → proximidad: "biogas W/3 upgrading"
#   SRCTITLE(...)        → filtrar por revista
#   DOCTYPE(ar)          → solo artículos originales (ar = article, re = review)
#
# Cada categoría puede tener MÚLTIPLES queries; los resultados se combinan y
# se deduplicán por DOI antes de guardar el CSV.
#
# Referencia: https://dev.elsevier.com/sc_search_tips.html

biological_gas_odor_treatment:
  - TITLE-ABS-KEY(biofiltration OR "biotrickling filter" OR BTF) AND TITLE-ABS-KEY("odor removal" OR "VOC removal" OR "volatile organic compound")
 # - TITLE-ABS-KEY("biofilter" AND ("hydrogen sulfide" OR "H2S" OR "ammonia" OR "toluene" OR "styrene"))
 # - TITLE-ABS-KEY("biotrickling filter" AND ("desulfurization" OR "odor" OR "VOC"))

